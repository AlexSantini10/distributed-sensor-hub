name: integration-tests

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  docker-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
              pip install -r requirements.txt
          fi

      - name: Deterministic state convergence check
        run: python -m pytest tests/integration/test_deterministic_state_convergence.py -q -s

      - name: Build and start cluster
        run: docker compose -f docker/docker-compose-base.yml up --build -d

      - name: Verify cluster startup and node connectivity
        run: python tests/integration/verify_cluster.py --timeout 60 --interval 2

      - name: Show container status
        if: always()
        run: docker compose -f docker/docker-compose-base.yml ps

      - name: Dump cluster logs
        if: failure()
        run: docker compose -f docker/docker-compose-base.yml logs --no-color

      - name: Stop cluster
        if: always()
        run: docker compose -f docker/docker-compose-base.yml down --volumes --remove-orphans
