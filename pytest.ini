[pytest]
addopts = -p no:cacheprovider
testpaths = tests
norecursedirs =
    tmp-pytest
    .pytest-temp
    .codex-tmp
    .tmp
    pytest-temp
    test-logging-*
    logs
    node_modules
    .git
markers =
    protocol: tests for the protocol layer
    networking: tests for TCP networking
    membership: tests for the membership subsystem
    gossip: tests for gossip push-pull engine
    fd: tests for phi-accrual failure detector
    runtime: tests for node startup, wiring, and background runtime services
    state: tests for the LWW state store and delta buffers
    sensors: tests for the local sensor simulator
    webapi: tests for the HTTP API and UI-facing semantics
    utils: tests for configuration, logging, and shared helpers
    integration: end-to-end and multi-node convergence checks
