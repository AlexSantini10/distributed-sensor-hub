name: docker-cd

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute release metadata
        id: prep
        shell: bash
        run: |
          echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_name=Release ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "release_name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image_name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.base
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release notes asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cat <<EOF > docker-node-release.txt
          Docker node image for version ${GITHUB_REF_NAME}

          Commit:
          ${GITHUB_SHA}

          Image:
          ${{ steps.prep.outputs.image_name }}@${{ steps.build.outputs.digest }}

          Tags:
          ${{ steps.prep.outputs.image_name }}:${GITHUB_REF_NAME}
          ${{ steps.prep.outputs.image_name }}:sha-${GITHUB_SHA}

          Pull:
          docker pull ${{ steps.prep.outputs.image_name }}@${{ steps.build.outputs.digest }}

          Run:
          docker run --rm -p 9000:9000 -p 10000:10000 ^
            -e NODE_ID=node-1 ^
            -e HOST=0.0.0.0 ^
            -e PORT=9000 ^
            -e WEB_API_PORT=10000 ^
            -e BOOTSTRAP_PEERS= ^
            ${{ steps.prep.outputs.image_name }}@${{ steps.build.outputs.digest }}
          EOF

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.prep.outputs.release_name }}
          generate_release_notes: true
          body: |
            Container image published for version `${{ github.ref_name }}`.

            Commit: `${{ github.sha }}`

            Registry image: `${{ steps.prep.outputs.image_name }}@${{ steps.build.outputs.digest }}`

            Pull it with:
            ```bash
            docker pull ${{ steps.prep.outputs.image_name }}@${{ steps.build.outputs.digest }}
            ```

            Run a node with:
            ```bash
            docker run --rm -p 9000:9000 -p 10000:10000 \
              -e NODE_ID=node-1 \
              -e HOST=0.0.0.0 \
              -e PORT=9000 \
              -e WEB_API_PORT=10000 \
              -e BOOTSTRAP_PEERS= \
              ${{ steps.prep.outputs.image_name }}@${{ steps.build.outputs.digest }}
            ```
          files: docker-node-release.txt
