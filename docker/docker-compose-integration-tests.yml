services:
  logs-cleaner:
    image: alpine:3.20
    command:
      - sh
      - -lc
      - |
        mkdir -p /app/logs
        rm -rf /app/logs/* /app/logs/.[!.]* /app/logs/..?* 2>/dev/null || true
    volumes:
      - ../logs:/app/logs
    restart: "no"

  node1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.base
    depends_on:
      logs-cleaner:
        condition: service_completed_successfully
    environment:
      NODE_ID: node1
      HOST: 0.0.0.0
      PORT: 9100
      BOOTSTRAP_PEERS: node2:9101,node3:9102
      LOG_LEVEL: INFO
      LOG_FILE: /app/logs/node1-integration.log
      CLEAR_LOG: "true"
      WEB_API_PORT: 11000
      HEARTBEAT_INTERVAL_MS: 400
      GOSSIP_SYNC_INTERVAL_MS: 300
      GOSSIP_PUSH_RATIO: 1.0
      GOSSIP_PUSH_MIN_PEERS: 1
      GOSSIP_PULL_RATIO: 1.0
      GOSSIP_PULL_MIN_PEERS: 1
      GOSSIP_PULL_EVERY_ROUNDS: 1
      NETWORK_DELAY_MS: 0
      NETWORK_DELAY_JITTER_MS: 0
      NETWORK_DELAY_SPIKE_PROB: 0
      NETWORK_DELAY_SPIKE_MS: 0
      NETWORK_PACKET_LOSS_PROB: 0
      SENSORS: 0
    ports:
      - "9100:9100"
      - "11000:11000"
    volumes:
      - ../logs:/app/logs
    command:
      - sh
      - -lc
      - |
        touch "$${LOG_FILE}";
        tail -n +1 -F "$${LOG_FILE}" &
        exec python node.py
    networks:
      - shared
      - group_a

  node2:
