name: plantuml-diagram

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  render-module-diagram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Download pinned PlantUML
        run: |
          curl -fsSL \
            -o /tmp/plantuml.jar \
            https://github.com/plantuml/plantuml/releases/download/v1.2024.3/plantuml-1.2024.3.jar

      - name: Render module dependency diagram
        run: java -jar /tmp/plantuml.jar -tsvg docs/module-dependencies.puml

      - name: Ensure README references rendered diagram
        run: grep -q "docs/module-dependencies.svg" README.md

      - name: Upload rendered diagram artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-dependencies-svg
          path: docs/module-dependencies.svg

      - name: Ensure rendered diagram was created
        run: test -s docs/module-dependencies.svg
