name: docker-cd

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute release metadata
        id: prep
        shell: bash
        run: |
          echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_name=Release ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "release_name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image_name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.base
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release notes asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cat <<EOF > docker-node-release.txt
          Docker node image for version ${GITHUB_REF_NAME}

          Commit:
          ${GITHUB_SHA}

          Image:
          ${{ steps.prep.outputs.image_name }}@${{ steps.build.outputs.digest }}

          Tags:
          ${{ steps.prep.outputs.image_name }}:${GITHUB_REF_NAME}
          ${{ steps.prep.outputs.image_name }}:sha-${GITHUB_SHA}

          Pull:
          docker pull ${{ steps.prep.outputs.image_name }}@${{ steps.build.outputs.digest }}

          Run:
          docker run --rm -p 9000:9000 -p 10000:10000 ^
            -e NODE_ID=node-1 ^
            -e HOST=0.0.0.0 ^
            -e PORT=9000 ^
            -e WEB_API_PORT=10000 ^
            -e BOOTSTRAP_PEERS= ^
            ${{ steps.prep.outputs.image_name }}@${{ steps.build.outputs.digest }}
          EOF

          cat <<EOF > docker-node.env.example
          # Minimal environment for a released single node container
          NODE_ID=node-1
          HOST=0.0.0.0
          PORT=9000
          BOOTSTRAP_PEERS=

          LOG_LEVEL=INFO
          LOG_FILE=/app/logs/node-1.log
          CLEAR_LOG=true

          WEB_API_PORT=10000

          SOCKET_TIMEOUT=1.0
          ACCEPT_QUEUE_SIZE=128
          MAX_CONNECTIONS=256
          MAX_WORKERS=64

          PHI_THRESHOLD_SUSPECT=3.0
          PHI_THRESHOLD_DEAD=8.0
          PHI_INITIAL_INTERVAL_S=1.0

          GOSSIP_SYNC_INTERVAL_MS=1000
          GOSSIP_PUSH_RATIO=0.3
          GOSSIP_PUSH_MIN_PEERS=2
          GOSSIP_PULL_RATIO=0.15
          GOSSIP_PULL_MIN_PEERS=1
          GOSSIP_PULL_EVERY_ROUNDS=3

          NETWORK_DELAY_MS=0
          NETWORK_DELAY_JITTER_MS=0
          NETWORK_DELAY_SPIKE_PROB=0
          NETWORK_DELAY_SPIKE_MS=0
          NETWORK_PACKET_LOSS_PROB=0
          TOPOLOGY_POLICY=full_mesh

          SENSORS=2

          SENSOR_0_TYPE=numeric
          SENSOR_0_NAME=temperature
          SENSOR_0_PERIOD_MS=1500
          SENSOR_0_MIN=15
          SENSOR_0_MAX=30
          SENSOR_0_UNIT=C

          SENSOR_1_TYPE=boolean
          SENSOR_1_NAME=motion
          SENSOR_1_PERIOD_MS=2500
          SENSOR_1_P_TRUE=0.3
          EOF

          cat <<EOF > docker-compose.release.yml
          services:
            node:
              image: ${{ steps.prep.outputs.image_name }}@${{ steps.build.outputs.digest }}
              container_name: distributed-sensor-hub-node
              env_file:
                - docker-node.env
              ports:
                - "9000:9000"
                - "10000:10000"
              volumes:
                - ./logs:/app/logs
          EOF

          cat <<EOF > RELEASE-README.md
          # Distributed Sensor Hub release bundle

          This release includes:

          - docker-node-release.txt: quick pull and run commands
          - docker-node.env.example: minimal environment file for one node
          - docker-compose.release.yml: compose file pinned to this image digest

          Quick start:

          1. Rename docker-node.env.example to docker-node.env
          2. Start the node:
             docker compose -f docker-compose.release.yml up -d
          3. Query the HTTP API:
             http://localhost:10000/api/introspection

          To stop the node:

          docker compose -f docker-compose.release.yml down
          EOF

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.prep.outputs.release_name }}
          generate_release_notes: true
          body: |
            Container image published for version `${{ github.ref_name }}`.

            Commit: `${{ github.sha }}`

            Registry image: `${{ steps.prep.outputs.image_name }}@${{ steps.build.outputs.digest }}`

            Pull it with:
            ```bash
            docker pull ${{ steps.prep.outputs.image_name }}@${{ steps.build.outputs.digest }}
            ```

            Run a node with:
            ```bash
            docker run --rm -p 9000:9000 -p 10000:10000 \
              -e NODE_ID=node-1 \
              -e HOST=0.0.0.0 \
              -e PORT=9000 \
              -e WEB_API_PORT=10000 \
              -e BOOTSTRAP_PEERS= \
              ${{ steps.prep.outputs.image_name }}@${{ steps.build.outputs.digest }}
            ```

            Release assets also include:
            - `docker-node.env.example`
            - `docker-compose.release.yml`
            - `RELEASE-README.md`
          files: docker-node-release.txt
            docker-node.env.example
            docker-compose.release.yml
            RELEASE-README.md
