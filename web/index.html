<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Distributed Sensor Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<header>
  <h1>Distributed Sensor Hub</h1>
  <div id="status">Disconnected</div>
</header>

<div class="controls">
  <input id="base-url" value="http://localhost:10000" size="28">
  <input id="refresh-ms" type="number" value="1000" min="200" step="100">
  <button id="apply">Apply</button>
</div>

<section class="stats">
  <div class="stat"><div class="label">Nodes</div><div id="stat-nodes" class="value">0</div></div>
  <div class="stat"><div class="label">Sensors</div><div id="stat-sensors" class="value">0</div></div>
  <div class="stat"><div class="label">Peers</div><div id="stat-peers" class="value">0</div></div>
  <div class="stat"><div class="label">Suspected</div><div id="stat-suspected" class="value">0</div></div>
  <div class="stat"><div class="label">Dead</div><div id="stat-dead" class="value">0</div></div>
  <div class="stat"><div class="label">Changed Last Poll</div><div id="stat-changed" class="value">0</div></div>
</section>

<main>
  <section id="nodes">
    <div class="nodes-group">
      <h2 class="nodes-group-title">Local Node</h2>
      <div id="nodes-local" class="nodes-grid"></div>
    </div>
    <div class="nodes-group">
      <h2 class="nodes-group-title">Other Nodes</h2>
      <div id="nodes-remote" class="nodes-grid"></div>
    </div>
  </section>

  <section id="side-panels">
    <section id="membership">
      <h2>Membership (Local View)</h2>
      <div class="membership-scroll">
        <table>
          <thead>
            <tr>
              <th>Peer</th>
              <th>Display</th>
              <th>Direct</th>
              <th>Evidence</th>
              <th>Phi</th>
              <th>Delta Last HB (ms)</th>
              <th>Evidence Source</th>
            </tr>
          </thead>
          <tbody id="membership-body"></tbody>
        </table>
      </div>
    </section>

    <section id="log">
      <h2>Updates log</h2>
      <div id="log-entries"></div>
    </section>
  </section>
</main>

<script src="./app.js"></script>
</body>
</html>
