services:
  logs-cleaner:
    image: alpine:3.20
    command:
      - sh
      - -lc
      - |
        mkdir -p /app/logs
        rm -rf /app/logs/* /app/logs/.[!.]* /app/logs/..?* 2>/dev/null || true
    volumes:
      - ../logs:/app/logs
    restart: "no"

  node-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.base
    container_name: node-1
    depends_on:
      logs-cleaner:
        condition: service_completed_successfully
    restart: "no"
    environment:
      NODE_ID: node-1
      HOST: 0.0.0.0
      PORT: 9200
      BOOTSTRAP_PEERS: node-2:9201,node-3:9202,node-4:9203
      LOG_LEVEL: DEMO
      LOG_FILE: /app/logs/node-1-demo.log
      CLEAR_LOG: "true"
      WEB_API_PORT: 12000

      DEMO_MODE: "true"
      FINITE_TEST_SENSOR: "true"
      SENSOR_CLASS: sensors.providers.finite_test_sensor.FiniteTestSensor
      READINGS_PER_SENSOR: "60"
      SENSOR_INTERVAL_MS: "1000"

      HEARTBEAT_INTERVAL_MS: 1000
      GOSSIP_SYNC_INTERVAL_MS: 1000
      GOSSIP_PUSH_RATIO: 0.35
      GOSSIP_PUSH_MIN_PEERS: 1
      GOSSIP_PULL_RATIO: 0.15
      GOSSIP_PULL_MIN_PEERS: 1
      GOSSIP_PULL_EVERY_ROUNDS: 3
      PHI_THRESHOLD_SUSPECT: 2.5
      PHI_THRESHOLD_DEAD: 8.0
      PHI_INITIAL_INTERVAL_S: 1.0
      REPLICATION_DELTA_MAXLEN: 1024

      NETWORK_DELAY_MS: 0
      NETWORK_DELAY_JITTER_MS: 0
      NETWORK_DELAY_SPIKE_PROB: 0
      NETWORK_DELAY_SPIKE_MS: 0
      NETWORK_PACKET_LOSS_PROB: 0

      SENSORS: 1
      SENSOR_0_TYPE: finite_test
      SENSOR_0_NAME: demo_node_1
      SENSOR_0_PERIOD_MS: 1000
      SENSOR_0_SEED: 101
      SENSOR_0_MAX_UPDATES: 60
      SENSOR_0_START_TS_MS: 1767225600000
      SENSOR_0_UNIT: demo
    ports:
      - "9200:9200"
      - "12000:12000"
    volumes:
      - ../logs:/app/logs
    command:
      - sh
      - -lc
      - |
        touch "$${LOG_FILE}";
        tail -n +1 -F "$${LOG_FILE}" &
        exec python node.py
    networks:
      - sensor-net

  node-2:
