name: integration-tests

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  docker-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
              pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
              pip install -r requirements.txt
          fi

      - name: Deterministic state convergence check
        run: python -m pytest tests/integration/test_deterministic_state_convergence.py -q -s

      - name: Build Docker image
        run: docker build -f docker/Dockerfile.base -t distributed-sensor-hub:ci-smoke .

      - name: Smoke test Docker image
        run: bash docker/smoke-test.sh distributed-sensor-hub:ci-smoke

      - name: Docker-backed cluster checks
        run: |
          python -m pytest \
            tests/integration/test_docker_crash_restart_recovery.py \
            tests/integration/test_docker_deterministic_state_convergence.py \
            tests/integration/test_docker_partition_reconciliation.py \
            -vv

